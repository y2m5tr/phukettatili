# ==============================================================================
# /etc/nginx/sites-available/phukettatili — Nginx Reverse Proxy Konfigürasyonu
# ==============================================================================
# Sunucuda kurulum:
#   sudo cp scripts/nginx-phukettatili.conf /etc/nginx/sites-available/phukettatili
#   sudo ln -s /etc/nginx/sites-available/phukettatili /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d phukettatili.com -d www.phukettatili.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name phukettatili.com www.phukettatili.com;

    # Brute-force koruması: /ops-login, /api/auth ve /api/*/auth uçları
    limit_req_zone $binary_remote_addr zone=phuket_auth:10m rate=10r/m;
    limit_req_status 429;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik Varlıklar İçin Uzun Ömürlü Önbellekleme
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|css|js|woff2|woff|ttf)$ {
        root /var/www/phukettatili/dist/client;
        expires 30d;
        # Hash'li Astro varlıkları (_astro/...) içerik değişince dosya adı değişir.
        # Bu yüzden immutable cache güvenlidir. Diğer statik dosyalar için
        # no-transform yeterli; tarayıcı doğrulama isteği gönderebilir.
        add_header Cache-Control "public, no-transform, max-age=2592000";
        try_files $uri @astro_node;
    }

    location ~* ^/_astro/ {
        root /var/www/phukettatili/dist/client;
        etag on;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri @astro_node;
    }

    location ~* ^/(ops-login|api/auth|api/.*/auth) {
        limit_req zone=phuket_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ana Uygulama Proxy (Astro SSR Node.js Sunucusu)
    location / {
        try_files $uri @astro_node;
    }

    location @astro_node {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;

        # WebSocket & Header İletimi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman Aşımı & Arabellek
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
