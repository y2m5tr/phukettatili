# ==============================================================================
# /etc/nginx/sites-available/phukettatili — Nginx Reverse Proxy Konfigürasyonu
# ==============================================================================

# HTTP -> HTTPS Yönlendirmesi (Tüm HTTP istekleri HTTPS'e 308 ile yönlendirilir)
# 308 status code: POST isteklerinde HTTP metodunu ve gövdesini korur.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name phukettatili.com www.phukettatili.com 87.192.36.63 wao8426iy8.verunix.com.tr;

    return 308 https://$host$request_uri;
}

# HTTPS Sunucu Bloğu
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phukettatili.com www.phukettatili.com 87.192.36.63 wao8426iy8.verunix.com.tr;

    ssl_certificate /etc/letsencrypt/live/phukettatili.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phukettatili.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www -> apex 301 kalıcı yönlendirmesi
    if ($host = "www.phukettatili.com") {
        return 301 https://phukettatili.com$request_uri;
    }

    # 404 Sayfasını Markalı HTML 404 Sayfasına Yönlendir
    error_page 404 =404 /404;

    location = /404 {
        proxy_pass http://127.0.0.1:4321/404;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Güvenlik Başlıkları
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip Sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Statik Varlıklar İçin Uzun Ömürlü Önbellekleme
    location ~* \.(webp|jpg|jpeg|png|gif|svg|ico|css|js|woff2|woff|ttf)$ {
        root /var/www/phukettatili/dist/client;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        try_files $uri @astro_node;
    }

    location ~* ^/_astro/ {
        root /var/www/phukettatili/dist/client;
        etag on;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri @astro_node;
    }

    # Ana Uygulama Proxy (Astro SSR Node.js Sunucusu)
    location / {
        try_files $uri @astro_node;
    }

    location @astro_node {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;

        # WebSocket & Header İletimi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zaman Aşımı & Arabellek
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_intercept_errors on;
    }
}
