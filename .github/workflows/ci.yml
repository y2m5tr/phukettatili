name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için yeni push gelirse eski koşuyu iptal et (token tasarrufu)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tip · Lint · Test · E2E · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # KRİTİK: Runner locale'i sabitlenir. WhatsApp mesaj formatlayıcıları
    # artık 'en-US' kullanıyor ama test beklentileri ve üçüncü taraf
    # davranışları deterministik kalsın diye ortam da sabitleniyor.
    # (tr-TR runner'da binlik ayraçlar değişip testler kırılmasın.)
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci: package-lock.json'a sadık, tekrarlanabilir kurulum
      - name: Bağımlılıkları kur
        run: npm ci

      # Güvenlik: bilinen zaafiyetli bağımlılıkları reddet. Yalnızca
      # production bağımlılık zincirinde high/critical varsa build kırılır;
      # dev-tool'ların low advisory'leri gürültü yaratmaz.
      - name: Güvenlik denetimi (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Tip kontrolü (astro check)
        run: npx astro check

      - name: Lint (Biome)
        run: npm run lint

      # 500 satır kuralı (CLAUDE.md) — ihlal build'i kırar. Yerelde de
      # .githooks/pre-commit aynı kontrolü commit anında çalıştırır.
      - name: Dosya boyutu bekçisi (500 satır)
        run: npm run check:lines

      - name: Testler
        run: npm test

      # E2E (Playwright): kritik dönüşüm yolu (ana sayfa→tur detayı),
      # admin fail-closed erişim kontrolü ve acente portalı — gerçek
      # tarayıcıda. Birim testler bunları kapsamaz.
      - name: E2E testleri kurulumu (Playwright)
        run: npx playwright install --with-deps chromium

      - name: E2E testleri
        run: npm run e2e

      # Üretim derlemesi — SSR/adapter/sitemap zincirinin çalıştığını kanıtlar.
      # Supabase env'leri opsiyonel; client'lar guard'lı, build secrets'sız geçer.
      - name: Build
        run: npm run build

      # Build çıktısında hassas verinin statik (auth'suz) asset olarak
      # sızmadığını doğrula. adminInitialData tohum verisi (müşteri/pasaport/
      # maliyet/komisyon) statik çıktıya düşmemeli — yalnızca sunucuda kalmalı.
      - name: Statik çıktı sızıntı taraması
        run: |
          static=.vercel/output/static
          if [ -d "$static/_astro" ]; then
            if ls "$static"/_astro/adminInitialData*.js >/dev/null 2>&1; then
              echo "::error::adminInitialData chunk statik çıktıya sızmış (tohum verisi herkese açık olur)."
              exit 1
            fi
            echo "✓ adminInitialData statik çıktıda yok"
          else
            echo "Statik çıktı dizini bulunamadı, tarama atlandı"
          fi
