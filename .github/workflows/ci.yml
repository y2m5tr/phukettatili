name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı dal için yeni push gelirse eski koşuyu iptal et (token tasarrufu)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tip kontrolü · Test · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci: package-lock.json'a sadık, tekrarlanabilir kurulum
      - name: Bağımlılıkları kur
        run: npm ci

      # 1) TypeScript + Astro şablon tipleri — davranış hatası olmasa da
      #    tanımsız değişken gibi gerçek hataları yakalar
      - name: Tip kontrolü (astro check)
        run: npx astro check

      # 2) 274 birim testi (48 dosya) — regresyon koruması
      - name: Testler
        run: npm test

      # 3) Biome: kullanılmayan import/değişken taraması.
      #    noUnusedImports=error, noUnusedVariables=warn → CI exit 0.
      - name: Lint (Biome)
        run: npm run lint

      # 4) Üretim derlemesi — SSR/adapter/sitemap zincirinin çalıştığını kanıtlar
      - name: Build
        run: npm run build

      # Build çıktısında hassas verinin statik (auth'suz) asset olarak
      # sızmadığını doğrula. src/lib/publicRefs.ts başlığındaki ayrım
      # bozulursa bu adım kırmızıya döner.
      - name: Statik çıktı sızıntı taraması
        run: |
          static=.vercel/output/static
          if [ -d "$static/_astro" ]; then
            # adminInitialData tohum verisi (müşteri/pasaport/maliyet/komisyon)
            # statik çıktıya düşmemeli — yalnızca sunucu fonksiyonunda kalmalı.
            if ls "$static"/_astro/adminInitialData*.js >/dev/null 2>&1; then
              echo "::error::adminInitialData chunk statik çıktıya sızmış (tohum verisi herkese açık olur)."
              exit 1
            fi
            echo "✓ adminInitialData statik çıktıda yok"
          else
            echo "Statik çıktı dizini bulunamadı, tarama atlandı"
          fi

      - name: Build çıktısını sakla
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist/client
          retention-days: 7
