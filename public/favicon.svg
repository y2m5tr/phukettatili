<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Luxury Midnight Ocean Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>

    <!-- Warm Amber / Gold Gradient for T and Accents -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Crisp Platinum / Pure White Gradient for P -->
    <linearGradient id="plat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Tropical Sun Dot -->
  <circle cx="256" cy="106" r="20" fill="url(#gold)"/>

  <!-- Centered Bold Monogram -->
  <g filter="url(#glow)" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'DM Sans', sans-serif; font-weight: 900; font-size: 248px; letter-spacing: -6px;">
    <text x="240" y="348" text-anchor="end" fill="url(#plat)">P</text>
    <text x="252" y="348" text-anchor="start" fill="url(#gold)">T</text>
  </g>

  <!-- Horizon Wave / Luxury Accent Line -->
  <rect x="136" y="388" width="240" height="8" rx="4" fill="url(#gold)"/>
</svg>